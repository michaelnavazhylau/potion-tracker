<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     width="1104" height="430" viewBox="0 0 1104 430"
     role="img" aria-labelledby="title desc">
